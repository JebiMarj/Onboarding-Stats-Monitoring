<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fcfbfc;--card:#fff;--tx:#3b3441;--mu:#8f8898;--bd:#f1eef2;--pri:#e4396e;--pri2:#c92c5c;--ac:#f79420;--pe:#fdc070;--hv:#fbf8fa;--ok:#188a57;--okb:#eaf7f1;--wn:#a85f00;--wnb:#fff6e8;--bad:#d12b5c;--badb:#fdf0f4}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:13.5px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
#app{display:flex;height:100%}#side{width:216px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:700;font-size:14px;line-height:1.2}.brand img{width:34px;height:34px}.brand small{display:block;font-weight:500;color:var(--mu);font-size:11px;margin-top:2px}
#side a{padding:9px 12px;border-radius:8px;color:var(--mu);font-weight:600;cursor:pointer}#side a:hover{background:var(--hv);color:var(--tx)}#side a.on{background:var(--badb);color:var(--pri)}
.usr{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 6px 2px;border-top:1px solid var(--bd)}.usr b{flex:1;font-size:13px}.usr button{padding:3px 9px;font-size:12px}
.av{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pe),var(--ac) 55%,var(--pri));color:#fff;font-weight:700;font-size:15px;flex:none}.av.s{width:26px;height:26px;font-size:11px;margin-right:8px;vertical-align:middle}
#main{flex:1;display:flex;flex-direction:column;min-width:0}#top{display:flex;gap:10px;align-items:center;padding:12px 26px 4px}#top .sp{flex:1}
.sbtn{display:flex;align-items:center;gap:8px;width:380px;max-width:55%;padding:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--mu);cursor:pointer}.sbtn:hover{border-color:var(--pri)}.sbtn kbd,.kb{margin-left:auto;font:600 11px inherit;border:1px solid var(--bd);border-radius:5px;padding:0 6px;background:var(--hv)}
#page{flex:1;overflow:auto;padding:12px 26px 28px}h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2{font-size:14px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:280px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px;overflow:hidden}.kpi{padding:14px 16px;border-right:1px solid var(--bd)}.kpi:last-child{border-right:0}.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}.kpi span{color:var(--mu);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .sp{flex:1}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}input:focus,select:focus,textarea:focus{outline:2px solid #e4396e55;border-color:var(--pri)}

const KEY='cnr_va_tracker_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!DB||DB.built!==SEED.built||SEED.built==='cloud')DB=JSON.parse(JSON.stringify(SEED));

const CFG=window.CNR_CONFIG&&window.CNR_CONFIG.url&&!/YOUR/.test(window.CNR_CONFIG.url)&&window.supabase?window.CNR_CONFIG:null;

const UN=()=>window.USER||'Marj';

vas:{t:'virtual_assistants',c:{id:'id',name:'name',status:'status',client:'client',business:'business',trainer:'trainer',role:'role',ob:'ob_date',endDate:'end_date',batch:'batch',endo:'endorsement',train:'training',updatedBy:'updated_by',updatedAt:'updated_at'}},

function toRow(k,r,vid){const o={};for(const[a,c]of Object.entries(MAP[k].c)){let x=r[a];if(x===''||x===undefined)x=null;if(a==='arch')x=!!x;o[c]=x}if(vid)o.va_id=vid;return o}

function TS(v){const s=ST(v),cl=k=>{for(let i=s.CR.length-1;i>=0;i--)if(s.CR[i][k]!=null)return s.CR[i][k];return null};
const parts=[['Attendance',10,s.ap],['Sales conversion',30,s.tl?Math.min(100,s.cr/(+DB.settings.conv||20)*100):null],['QA',20,s.avg],['Tool Navigation',10,cl('Tool Navigation')],['Communication',10,cl('Communication')],['Critical Thinking',10,cl('Critical Thinking')],['Core Values',10,cl('Core Values')]].filter(p=>p[2]!=null);
const w=parts.reduce((a,p)=>a+p[1],0),o=parts.length>=2?parts.reduce((a,p)=>a+p[1]*p[2],0)/w:null;
return{o,n:parts.length,res:o==null?'Pending':o>=+DB.settings.trainPass?'Passed':'Not passed',tip:parts.map(p=>p[0]+' '+r1(p[2])+'%').join(', ')}}
const rb=r=>`<span class="b ${r==='Passed'?'ok':r==='Not passed'?'bad':''}">${r}</span>`;
const bst=k=>{const L=DB.vas.filter(v=>v.batch===k),Z=L.map(ST),T=L.map(TS),pass=T.filter(t=>t.res==='Passed').length;return{L,n:L.length,now:L.filter(v=>v.status==='Onboarding').length,att:mean(Z.map(s=>s.ap).filter(x=>x!=null)),qa:mean(Z.map(s=>s.avg).filter(x=>x!=null)),sc:mean(T.map(t=>t.o).filter(x=>x!=null)),pass,fail:T.filter(t=>t.res==='Not passed').length,ev:T.filter(t=>t.res!=='Pending').length}};
const kp=a=>`<div class="kpis">${a.map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>`;
function batches(){const K=BK().slice().reverse(),St=K.map(bst);
return`<h1>Training Batches</h1>`+kp([['Training batches',K.length],['Total trainees',DB.vas.length],['In training now',DB.vas.filter(v=>v.status==='Onboarding').length],['Average attendance',P(mean(DB.vas.map(v=>ST(v).ap).filter(x=>x!=null)))]])+`<div class="g3">${K.map((k,i)=>{const b=St[i];return`<div class="bc" data-a="batch" data-k="${k}"><div class="bar" style="margin:0"><b>${BN(k)}</b><span class="sp"></span>${b.now?`<span class="b wn">${b.now} in training</span>`:'<span class="b ok">Completed</span>'}</div><div class="mu sm">${b.n} trainees</div><div class="hd" style="margin:14px 0 0;gap:20px"><div><small>Attendance</small>${P(b.att)}</div><div><small>Avg QA</small>${P(b.qa)}</div><div><small>Avg score</small>${P(b.sc)}</div></div></div>`}).join('')}</div>`}
function batchd(){const k=S.batch,b=bst(k);return`<div class="bar"><button class="g s" data-a="nav" data-p="bat">‹ All batches</button></div><h1>${BN(k)}</h1>`+kp([['Trainees',b.n],['In training now',b.now],['Average attendance',P(b.att)],['Average QA',P(b.qa)]])+`<div class="win">${tbl(['Trainee','Status','Attendance','Latest QA','Training score','Result'],b.L.map(v=>{const s=ST(v),t=TS(v);return`<tr class="cl" data-a="open" data-id="${v.id}"><td><span class="av s">${ini(v.name)}</span><b>${esc(v.name)}</b></td><td>${sb(v.status)}</td><td>${P(s.ap)}</td><td>${qb(s.L)}</td><td>${P(t.o)}</td><td>${rb(t.res)}</td></tr>`}))}</div>`}
function trainres(){const f=S.f,L=DB.vas.filter(v=>(!f.batch||v.batch===f.batch)&&(!f.res||TS(v).res===f.res)),all=DB.vas.filter(v=>!f.batch||v.batch===f.batch),T=all.map(TS),sc=T.map(t=>t.o).filter(x=>x!=null),band=(a,b)=>sc.filter(x=>x>=a&&x<b).length;
return`<h1>Training Results</h1>`+kp([['Evaluated',T.filter(t=>t.res!=='Pending').length],['Meeting the pass mark',T.filter(t=>t.res==='Passed').length],['Below the pass mark',T.filter(t=>t.res==='Not passed').length],['Approved results',all.filter(v=>TRN(v).final==='Approved').length]])+`<div class="win" style="margin-bottom:14px"><h2>Evaluation data <span class="mu sm" style="font-weight:400;margin-left:8px">Pass mark ${DB.settings.trainPass}%</span></h2>${[['90 – 100',90,101],['80 – 89',80,90],['70 – 79',70,80],['Below 70',-1,70]].map(x=>{const n=band(x[1],x[2]);return`<div class="hb"><span>${x[0]}</span><div class="cb"><i style="width:${sc.length?n/sc.length*100:0}%"></i></div><b>${n}</b></div>`}).join('')}</div>
<div class="bar">${bsel('page')}<select data-f="res" data-s="page"><option value="">All results</option>${opts(['Passed','Not passed','Pending'],f.res)}</select><span class="mu">${L.length} trainees</span></div><div class="win">${tbl(['Trainee','Batch','Overall score','Result','Review','Final step',''],L.map(v=>{const t=TS(v),x=TRN(v);return`<tr class="cl" data-a="open" data-id="${v.id}"><td><span class="av s">${ini(v.name)}</span><b>${esc(v.name)}</b></td><td>${esc(BN(v.batch))}</td><td title="${esc(t.tip)}">${P(t.o)}</td><td>${rb(t.res)}</td><td>${esc(x.review)}</td><td><span class="b ${x.final==='Approved'?'ok':x.final==='In training'?'wn':''}">${esc(x.final)}</span></td><td>${can('train')?`<button class="g s" data-a="trs" data-id="${v.id}">Update</button>`:''}</td></tr>`}))}</div><p class="mu sm">Overall score weights: attendance 10%, sales conversion 30%, QA 20%, tool navigation, communication, critical thinking and core values 10% each. Scores use the components recorded so far (at least two needed).</p>`}
function trainrep(){const K=BK().slice().reverse(),R=K.map(k=>[k,bst(k)]),pm=+DB.settings.trainPass,H=['Batch','Trainees','Passed','Not passed','Average training score','Pass rate'],rows=R.map(([k,b])=>[BN(k),b.n,b.pass,b.fail,r1(b.sc),b.ev?r1(b.pass/b.ev*100)+'%':'—']);REP=[H,...rows];
const allS=DB.vas.map(v=>TS(v).o).filter(x=>x!=null);
return`<h1>Training Reports</h1><div class="bar"><span class="sp"></span><button class="g" data-a="csv">Export CSV</button><button class="g" data-a="print">Print</button></div>`+kp([['Batches',K.length],['Passed',R.reduce((a,x)=>a+x[1].pass,0)],['Not passed',R.reduce((a,x)=>a+x[1].fail,0)],['Average training score',P(mean(allS))]])+`<div class="win" style="margin-bottom:14px">${tbl(H,R.map(([k,b],i)=>`<tr class="cl" data-a="batch" data-k="${k}">${rows[i].map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`))}</div><div class="g2"><div class="win"><h2>Training pass rate by batch</h2>${R.map(([k,b])=>`<div class="hb"><span>${BN(k)}</span><div class="cb"><i style="width:${b.ev?b.pass/b.ev*100:0}%"></i></div><b>${b.ev?P(b.pass/b.ev*100):'—'}</b></div>`).join('')}</div><div class="win"><h2>Average training score by batch</h2>${R.map(([k,b])=>`<div class="hb"><span>${BN(k)}</span><div class="cb"><i style="width:${b.sc||0}%"></i><u style="left:${pm}%" title="Pass mark ${pm}%"></u></div><b>${P(b.sc)}</b></div>`).join('')}<div class="mu sm">Line marks the ${pm}% pass mark.</div></div></div>`}

else if(t.dataset.a==='setstage'){moveTo(S.va,t.value)}else if(t.dataset.a==='setbatch'){V(S.va).batch=t.value;save();render()}else if(t.dataset.set){if(!ROLES[role].includes('*'))return;DB.settings[t.dataset.set]=+t.value||0;save()}
else if(t.dataset.f){S.f[t.dataset.f]=t.value;if(t.dataset.f==='mode')S.f.pd=S.f.pd;S.pg=0;render()}});

const HASH='__removed__';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const authed=()=>SB?!!window._ok:(()=>{try{return sessionStorage.getItem('cnr_auth')==='1'}catch(e){return false}})();
function gate(){$('#login').style.display=authed()?'none':'grid';if(authed())render();else setTimeout(()=>$('#lp').focus(),50)}
Object.assign(A,{
login:async()=>{if(SB)return cloudLogin();if(HASH==='__removed__'){$('#le').textContent='Add your Supabase details to config.js to sign in.';return}const u=$('#lu').value.trim().toLowerCase();let ok=false;try{ok=u==='marj'&&await sha($('#lp').value)===HASH}catch(e){}if(ok){try{sessionStorage.setItem('cnr_auth','1')}catch(e){}$('#le').textContent='';$('#lp').value='';gate()}else{$('#le').textContent='Incorrect username or password.';$('#lp').value='';$('#lp').focus()}},
logout:()=>{if(SB){SB.auth.signOut().then(()=>{window._ok=false;window.USER=null;DB={vas:[],moves:[],settings:SEED.settings,built:SEED.built};gate()});return}try{sessionStorage.removeItem('cnr_auth')}catch(e){}gate()},eye:d=>{const p=$('#lp'),h=p.type==='password';p.type=h?'text':'password';document.querySelector('[data-a=eye]').textContent=h?'Hide':'Show'},
fo:()=>{S.fo=!S.fo;render()},all:()=>{S.f.all=!S.f.all;render()},chip:d=>{S.f.status=d.v;S.pg=0;render()},rm:d=>{delete S.f[d.k];render()},
pal:()=>{$('#pal').style.display='flex';$('#pi').value='';pa=0;palR();setTimeout(()=>$('#pi').focus(),20)},palx:()=>$('#pal').style.display='none',
pick:d=>{const x=PI[+d.i];if(!x)return;A.palx();if(x.t==='va')A.open({id:x.id});else{S.page='va';S.f={q:x.l};S.pg=0;render()}}});
let PI=[],pa=0;
function palR(){const q=$('#pi').value.trim().toLowerCase(),m=s=>s.toLowerCase().includes(q);
const vs=DB.vas.filter(v=>q?m(v.name+' '+(v.client||'')+' '+(v.business||'')):v.status==='Onboarding').slice(0,7).map(v=>({t:'va',id:v.id,l:v.name,s:[v.client,v.business].filter(Boolean).join(' · '),b:v.status}));
const cl=q?[...new Set(DB.vas.flatMap(v=>[v.client,v.business]))].filter(x=>x&&m(x)).slice(0,4).map(x=>({t:'f',l:x,s:'Show VAs for this client or business'})):[];
PI=[...vs,...cl];pa=Math.min(pa,Math.max(0,PI.length-1));
$('#pl').innerHTML=(PI.length?`<div class="ph">${q?'VAs':'Currently onboarding'}</div>`:'<div class="ph">No matches. Try a name, client or business.</div>')+PI.map((x,i)=>(x.t==='f'&&PI[i-1]?.t==='va'?'<div class="ph">Clients and businesses</div>':'')+`<div class="pi ${i===pa?'on':''}" data-a="pick" data-i="${i}">${x.t==='va'?`<span class="av s">${ini(x.l)}</span>`:'🏢 '}<span>${esc(x.l)}<br><small>${esc(x.s)}</small></span>${x.b?sb(x.b).replace('class="b','class="b'):''}</div>`).join('')}
$('#pi').addEventListener('input',()=>{pa=0;palR()});
$('#pi').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){pa=Math.min(PI.length-1,pa+1)}else if(e.key==='ArrowUp'){pa=Math.max(0,pa-1)}else if(e.key==='Enter'){A.pick({i:pa});return}else if(e.key==='Escape'){A.palx();return}else return;e.preventDefault();palR();document.querySelector('.pi.on')?.scrollIntoView({block:'nearest'})});
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')A.palx()});$('#mod').addEventListener('mousedown',e=>{if(e.target.id==='mod')A.close()});
document.addEventListener('keydown',e=>{if(!authed())return;const tg=e.target.tagName,typing=['INPUT','TEXTAREA','SELECT'].includes(tg);if((e.key==='k'&&(e.ctrlKey||e.metaKey))||(e.key==='/'&&!typing)){e.preventDefault();A.pal()}else if(e.key==='Escape'){A.palx();A.close()}});
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')A.login()});$('#lu').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lp').focus()});
