<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create &amp; Reach — Onboarding QA</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('cnr_theme') || localStorage.getItem('cnr-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" hidden></div>
  <div id="login" hidden></div>
  <div id="mod" class="ov"></div>
  <div id="pal" class="ov"></div>
  <noscript><p>This app needs JavaScript.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/score.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/model.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
