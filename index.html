function evalPage(){
  const v=V(S.va);
  if(!v)return `<h1>Weekly evaluation</h1><p class="mu">Choose a VA from the QA sheet.</p>`;
  const list=evalsOf(v);
  const ev=selectedEval(v);
  const locked=!!(ev&&ev.closed);
  const bundle=ev?scoreBundle(ev):null;
  const weekSelect=list.length?`<label class="weekpick"><span>Week</span><select data-a="pickweek">${list.map(e=>`<option value="${e.week}" ${ev&&e.week===ev.week?'selected':''}>${fmt(e.week)}${e.closed?' · closed':''}</option>`).join('')}</select></label>`:'';
  const msg=S.err?`<div class="note" id="evalmsg">${esc(S.err)}</div>`:'<div id="evalmsg"></div>';
  const head=extra=>`<header class="sheethead"><div class="sheetnav"><button class="g s" data-a="back">Back</button>${extra||''}</div>`;
  if(!ev)return `${head('')}<h1>${esc(v.name)}</h1><p class="lead">No weekly evaluation yet. A new week starts at 40 scheduled hours and 100% attendance.</p></header><button data-a="startweek">Start weekly evaluation</button>`;
  const history=v.coaching.filter(c=>!c.arch&&c.evalId===ev.id);
  const links=[linkLine(ev.formUrl,'Open evaluation form'),linkLine(ev.callUrl,'Open call recording')].filter(Boolean).join('');
  return `${head(weekSelect)}
<h1>${esc(v.name)} ${sb(v.status)} ${qaBadge(v)}</h1>
<p class="lead">${esc([v.client,v.business].filter(Boolean).join(' · ')||'No client')} · ${esc(BN(v.batch))} · ${esc(v.schedule||'No schedule yet')}</p></header>
${msg}
<div class="card"><h2>KPI formula</h2><div id="formulabody">${formulaHtml(bundle)}</div></div>
<div class="split">
<div>
<div class="card"><h2>Attendance <span class="mu sm">${kpiWeights().attendance}%</span></h2><p class="mu sm">Default is a full week: 5 days × 8 hours. Deduct absence days, late minutes, and downtime minutes.</p><div class="fields">${fld('schedHours','Scheduled hours',ev.schedHours,'number',locked)}${fld('absenceDays','Absence days',ev.absenceDays,'number',locked)}${fld('lateMin','Late minutes',ev.lateMin,'number',locked)}${fld('downMin','Downtime minutes',ev.downMin,'number',locked)}</div><p class="mu">Attendance score <b>${bundle.parts.attendance==null?'—':r2(bundle.parts.attendance)}</b></p></div>
<div class="card"><h2>QA <span class="mu sm">${kpiWeights().qa}%</span></h2><div class="fields">${fld('qaScore','QA score (0–100)',ev.qaScore,'number',locked)}${fld('formUrl','Evaluation form link',ev.formUrl,'url',locked)}${fld('callUrl','Call recording link',ev.callUrl,'url',locked)}</div>${links?`<div class="actions">${links}</div>`:''}</div>
<div class="card"><h2>Weekly WBR <span class="mu sm">${kpiWeights().conversion}%</span></h2><div class="fields">${fld('total','Total leads',ev.total,'number',locked)}${fld('conv','Converted leads',ev.conv,'number',locked)}</div><p class="mu">Conversion score <b>${bundle.parts.conversion==null?'—':r2(bundle.parts.conversion)}</b></p></div>
<div class="card"><h2>Competencies</h2><div class="fields">${fld('tool','Tool navigation',ev.tool,'number',locked)}${fld('comm','Communication',ev.comm,'number',locked)}${fld('think','Critical thinking',ev.think,'number',locked)}${fld('core','Core values',ev.core,'number',locked)}</div><div class="stack">${area('compNote','Comment',ev.compNote,locked)}</div></div>
<div class="card"><h2>Coaching or feedback</h2><p class="mu sm">Saved to coaching history. Not part of the score.</p><div class="fields"><label>Date<input data-coach="date" type="date" value="${today}" ${locked?'disabled':''}></label><label>Topic<input data-coach="topic" value="" ${locked?'disabled':''}></label></div><div class="stack">${area('x','Discussion details','',locked).replace('data-ev="x"','data-coach="note"')}</div>${locked?'':`<div class="actions"><button class="g" data-a="savecoach">Save coaching history</button></div>`}${history.length?`<div class="mu sm" style="margin-top:10px">${history.map(c=>`<div><b>${fmt(c.date)}</b> ${esc(c.topic||'')}</div>`).join('')}</div>`:''}</div>
</div>
<div>
<div class="card"><h2>Close this week</h2><p class="mu sm">${bundle.outcome==='Continue onboarding'?'Under the pass mark. Gaps and coaching actions are required before this week can close.':'At or above the pass mark, endorsement stays a separate click. Gaps are optional.'}</p><div class="stack">${area('gaps','Gaps',ev.gaps,locked)}${area('coachAct','Coaching actions',ev.coachAct,locked)}</div>
<div class="actions">${locked?'':`<button class="g" data-a="saveeval">Save draft</button><button data-a="closeweek">Close week</button>`}${locked?`<button data-a="nextweek">Next weekly evaluation</button>`:''}${kpiReady(v)&&v.status==='Onboarding'?`<button class="o" data-a="endorse">Endorse</button>`:''}</div>
${ev.closed?`<p class="mu">Closed as ${esc(ev.outcome)}. Stored score ${r2(ev.score)}.</p>`:''}
</div></div></div>`;
}
function linkLine(url,label){return url&&/^https?:\/\//i.test(url)?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`:''}
function closeEval(){
  const v=V(S.va),ev=selectedEval(v);
  if(!v||!ev||ev.closed)return;
  Object.assign(ev,readEvalFields());
  const b=scoreBundle(ev);
  if(b.score==null){S.err='Enter at least two scored sections before closing the week.';render();return}
  if(b.outcome==='Continue onboarding'&&(!(ev.gaps&&String(ev.gaps).trim())||!(ev.coachAct&&String(ev.coachAct).trim()))){S.err='Record gaps and coaching actions before closing a week under the pass mark.';render();return}
  ev.score=b.score;ev.outcome=b.outcome;ev.closed=true;ev.updatedBy=by();ev.updatedAt=today;
  if(!v.endo)v.endo={stage:'Not Yet Ready'};
  if(v.endo.stage!=='Endorsed'){
    if(b.outcome==='Ready for endorsement')v.endo.stage='Ready for Endorsement';
    else if(v.endo.stage==='Ready for Endorsement')v.endo.stage='Not Yet Ready';
  }
  S.err='';save();render();
}

pick:d=>{const x=PI[+d.i];if(!x)return;A.palx();if(x.t==='va')A.open({id:x.id});else{S.page='va';S.f={q:x.l};S.pg=0;render()}}});
let PI=[],pa=0;
function palR(){const q=$('#pi').value.trim().toLowerCase(),m=s=>s.toLowerCase().includes(q);
const vs=DB.vas.filter(v=>q?m(v.name+' '+(v.client||'')+' '+(v.business||'')):v.status==='Onboarding').slice(0,7).map(v=>({t:'va',id:v.id,l:v.name,s:[v.client,v.business].filter(Boolean).join(' · '),b:v.status}));
const cl=q?[...new Set(DB.vas.flatMap(v=>[v.client,v.business]))].filter(x=>x&&m(x)).slice(0,4).map(x=>({t:'f',l:x,s:'Show VAs for this client or business'})):[];
PI=[...vs,...cl];pa=Math.min(pa,Math.max(0,PI.length-1));
$('#pl').innerHTML=(PI.length?`<div class="ph">${q?'VAs':'Currently onboarding'}</div>`:'<div class="ph">No matches. Try a name, client or business.</div>')+PI.map((x,i)=>(x.t==='f'&&PI[i-1]?.t==='va'?'<div class="ph">Clients and businesses</div>':'')+`<div class="pi ${i===pa?'on':''}" data-a="pick" data-i="${i}">${x.t==='va'?`<span class="av s">${ini(x.l)}</span>`:'🏢 '}<span>${esc(x.l)}<br><small>${esc(x.s)}</small></span>${x.b?sb(x.b).replace('class="b','class="b'):''}</div>`).join('')}
$('#pi').addEventListener('input',()=>{pa=0;palR()});
$('#pi').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){pa=Math.min(PI.length-1,pa+1)}else if(e.key==='ArrowUp'){pa=Math.max(0,pa-1)}else if(e.key==='Enter'){A.pick({i:pa});return}else if(e.key==='Escape'){A.palx();return}else return;e.preventDefault();palR();document.querySelector('.pi.on')?.scrollIntoView({block:'nearest'})});
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')A.palx()});$('#mod').addEventListener('mousedown',e=>{if(e.target.id==='mod')A.close()});
document.addEventListener('keydown',e=>{if(!authed())return;const tg=e.target.tagName,typing=['INPUT','TEXTAREA','SELECT'].includes(tg);if((e.key==='k'&&(e.ctrlKey||e.metaKey))||(e.key==='/'&&!typing)){e.preventDefault();A.pal()}else if(e.key==='Escape'){A.palx();A.close()}});
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')A.login()});$('#lu').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lp').focus()});

document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(c)e.dataTransfer.setData('text/plain',c.dataset.drag)});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('.col')?.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest?.('.col');if(!c)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id)moveTo(id,c.dataset.st)});

Object.assign(A,{
openqa(d){S.va=d.id;S.from='qa';S.page='eval';S.week=null;S.err='';render();const p=$('#page');if(p)p.scrollTop=0},
openeval(){S.from=S.page;S.page='eval';S.week=null;S.err='';render()},
qadone(){const v=V(S.va);if(!v)return;v.qaOn=true;const t=v.train||{};v.train={review:t.review&&t.review!=='Pending'?t.review:'Reviewed',final:'Approved'};v.updatedBy=by();v.updatedAt=today;save();render()},
saveeval(){const v=V(S.va),ev=selectedEval(v);if(!ev||ev.closed)return;Object.assign(ev,readEvalFields());ev.updatedBy=by();ev.updatedAt=today;S.err='';save();render()},
closeweek(){closeEval()},
nextweek(){const v=V(S.va);if(!v)return;const list=evalsOf(v);const week=list.length?addDays(list.at(-1).week,7):mondayOf(today);v.evals=v.evals||[];if(!list.some(e=>e.week===week))v.evals.push(blankEval(week));S.week=week;S.err='';save();render()},
startweek(){const v=V(S.va);if(!v)return;const week=mondayOf(today);v.evals=v.evals||[];if(!evalsOf(v).some(e=>e.week===week))v.evals.push(blankEval(week));S.week=week;S.err='';save();render()},
saveweights(){const w={};CNRScore.WEIGHT_KEYS.forEach(k=>{const el=document.querySelector('[data-w="'+k+'"]');w[k]=Number(el&&el.value)});const sumEl=document.getElementById('werr');if(!CNRScore.weightsValid(w)){if(sumEl)sumEl.textContent='Weights must sum to 100. They currently sum to '+CNRScore.weightsSum(w)+'.';return}DB.settings.weights=w;const pass=document.querySelector('[data-pass]');if(pass&&pass.value!=='')DB.settings.kpiPass=Number(pass.value);const rule=document.querySelector('[data-rule]');if(rule)DB.settings.missingRule=rule.value;if(sumEl)sumEl.textContent='KPI settings saved.';save()},
savebatches(){const names=Object.assign({},DB.settings.batchNames||{});document.querySelectorAll('[data-batch-id]').forEach(el=>{const id=el.getAttribute('data-batch-id');const val=el.value.trim();if(val)names[id]=val;else delete names[id]});DB.settings.batchNames=names;save();render()},
savecoach(){const v=V(S.va),ev=selectedEval(v);if(!v)return;const date=(document.querySelector('[data-coach="date"]')||{}).value;const topic=((document.querySelector('[data-coach="topic"]')||{}).value||'').trim();const note=((document.querySelector('[data-coach="note"]')||{}).value||'').trim();if(!date||!topic){S.err='Coaching history needs a date and a topic.';render();return}v.coaching=v.coaching||[];v.coaching.push({id:uid(),date,topic:topic+(note?'\n\n'+note:''),status:'Completed',coach:UN(),evalId:ev&&ev.id,createdBy:by(),createdAt:today});S.err='';save();render()}
});

start();
